<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Image Gallery</title>
    <link rel="stylesheet" href="Task 2.css">
</head>
<body>

    <div class="gallery-wrapper">
        <header class="main-header">
            <h1 class="dynamic-title">ANIMATED <span>Image Gallery</span></h1>
            <div class="status-badge">Effects & Animations Lab</div>
        </header>

        <div class="gallery-container">
            <div class="image-viewport">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" id="galleryImg" alt="Gallery Image">
                <div class="caption-overlay">
                    <p id="caption">Majestic Mountains</p>
                </div>
            </div>

            <div class="nav-controls">
                <button id="prevBtn">Previous</button>
                <button id="nextBtn">Next</button>
            </div>
        </div>
    </div>

    <script src="Task 2.js"></script>
</body>
</html>
