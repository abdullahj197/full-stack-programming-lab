<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validator Lab</title>
    <link rel="stylesheet" href="Task 3.css">
</head>
<body>

    <div class="main-container">
        <h1 class="top-title">Dynamic Form Validator</h1>
        
        <form id="signupForm" class="flat-form" novalidate>
            <div class="field-wrapper">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="John Doe">
                <p class="error-text" id="nameError"></p>
            </div>

            <div class="field-wrapper">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="hello@example.com">
                <p class="error-text" id="emailError"></p>
            </div>

            <div class="field-wrapper">
                <label>Password</label>
                <input type="password" id="password" placeholder="At least 6 characters">
                <p class="error-text" id="passError"></p>
            </div>

            <button type="submit" id="submitBtn">Verify & Submit</button>
        </form>

        <div id="successMessage" class="success-banner hidden">
            <h2>✓ Submission Successful</h2>
            <p>Your data has been validated .</p>
        </div>
    </div>

    <script src="Task 3.js"></script>
</body>
</html>
