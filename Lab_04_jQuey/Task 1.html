<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab: Dynamic List Manager</title>
    <link rel="stylesheet" href="Task 1.css">
</head>
<body>

    <div class="container">
        <header class="main-header">
            <h1 class="dynamic-title">DYNAMIC <span>List Manager</span></h1>
            <div class="status-badge">DOM Manipulation Lab</div>
        </header>

        <div class="app-card">
            <div class="input-group">
                <input type="text" id="itemInput" placeholder="Add a new task..." autocomplete="off">
                <button id="addBtn">Add Item</button>
            </div>

            <ul id="itemList">
                </ul>
        </div>
    </div>

    <script src="Task 1.js"></script>
</body>
</html>
